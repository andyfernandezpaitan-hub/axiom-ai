name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimo privilegio: el workflow solo puede leer el codigo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Revisar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Pruebas
        run: npm test

      - name: Escanear dependencias
        run: npm audit --audit-level=high
